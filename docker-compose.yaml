services:
  postgres:
    image: postgres:16
    container_name: api-product-db
    environment:
      POSTGRES_DB: apiproduct
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apiproduct"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: api-product-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apiproduct
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
